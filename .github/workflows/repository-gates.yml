name: Repository gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static repository gates
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository consistency gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/check_repo_consistency.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
