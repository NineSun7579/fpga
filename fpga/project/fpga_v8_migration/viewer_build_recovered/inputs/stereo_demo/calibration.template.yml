%YAML:1.0
---
# Template only. Zero focal lengths and translation intentionally prevent use.
# Replace K1/D1/K2/D2/R/T with a stereo calibration for THIS left/right ordering.
# T is the left-to-right extrinsic translation, expressed in meters.
image_width: 640
image_height: 480
length_unit: m
K1: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0., 0., 0., 0., 0., 0., 0., 0., 1.]
D1: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [0., 0., 0., 0., 0.]
K2: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0., 0., 0., 0., 0., 0., 0., 0., 1.]
D2: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [0., 0., 0., 0., 0.]
R: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
T: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0., 0., 0.]
